version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: carbontrack_db
    environment:
      POSTGRES_USER: ${DB_USER:-carbontrack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carbontrack_pass}
      POSTGRES_DB: ${DB_NAME:-carbontrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:

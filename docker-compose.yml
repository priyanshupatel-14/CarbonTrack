services:
  db:
    image: postgres:15-alpine
    container_name: carbontrack_db
    environment:
      POSTGRES_USER: ${DB_USER:-carbontrack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carbontrack_pass}
      POSTGRES_DB: ${DB_NAME:-carbontrack_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-carbontrack_user} -d ${DB_NAME:-carbontrack_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carbontrack_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-carbontrack_user}
      DB_PASSWORD: ${DB_PASSWORD:-carbontrack_pass}
      DB_NAME: ${DB_NAME:-carbontrack_db}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

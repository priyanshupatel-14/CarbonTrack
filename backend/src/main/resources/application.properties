spring.application.name=backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carbontrack_db}
spring.datasource.username=${DB_USER:carbontrack_user}
spring.datasource.password=${DB_PASSWORD:carbontrack_pass}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:this-is-a-very-secure-secret-key-for-carbontrack-development}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Evidence Verification Configuration (Phase 7)
carbontrack.ai.enabled=${AI_ENABLED:false}
carbontrack.ai.provider=${AI_PROVIDER:mock}
carbontrack.ai.api-key=${AI_API_KEY:}
carbontrack.ai.model=${AI_MODEL:gemini-3.5-flash-lite}
carbontrack.ai.base-url=${AI_BASE_URL:}
carbontrack.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:10}
carbontrack.ai.timeout-ms=${AI_TIMEOUT_MS:10000}
carbontrack.ai.confidence-threshold=${AI_CONFIDENCE_THRESHOLD:0.70}
